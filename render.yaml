services:
  - type: web
    name: ai-sprint-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --no-input && python manage.py migrate --no-input
    startCommand: python -m gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.7
      - key: DJANGO_ENV
        value: production
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: DJANGO_ALLOWED_HOSTS
        fromService:
          type: web
          name: ai-sprint-api
          envVarKey: RENDER_EXTERNAL_HOSTNAME
      - key: DJANGO_CORS_ALLOWED_ORIGINS
        fromService:
          type: web
          name: ai-sprint-workshop
          envVarKey: RENDER_EXTERNAL_URL
      - key: DJANGO_TIME_ZONE
        value: Asia/Kolkata
      - key: DJANGO_BEHIND_PROXY
        value: "True"
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        fromService:
          type: web
          name: ai-sprint-workshop
          envVarKey: RENDER_EXTERNAL_URL
      - key: CAMPAIGN_NAME
        value: AI Sprint - Build Your First AI Project in 60 Minutes
      - key: CAMPAIGN_TARGET
        value: "500"
      - key: CAMPAIGN_DURATION_DAYS
        value: "7"
      - key: CAMPAIGN_BUDGET_INR
        value: "2000"
      - key: CAMPAIGN_TIME_ZONE
        value: Asia/Kolkata

  - type: web
    name: ai-sprint-workshop
    runtime: static
    rootDir: frontend
    buildCommand: npm ci --include=dev && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 24.18.0
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: ai-sprint-api
          envVarKey: RENDER_EXTERNAL_URL
